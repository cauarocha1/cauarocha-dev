<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Prévia do widget Cauã AI</title>
  <desc id="desc">Assistente do portfólio em uma interface inspirada em terminal, com sugestões e entrada por streaming.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ed"/>
      <stop offset="1" stop-color="#ded4c4"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12201b"/>
      <stop offset="1" stop-color="#07100d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#07100d" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="104" cy="140" r="38" fill="none" stroke="#17211d" stroke-opacity=".18"/>
  <circle cx="1080" cy="770" r="92" fill="#d7e94d" opacity=".35"/>
  <path d="M0 790c240-90 410 88 660-4 224-83 354-52 540 17v97H0Z" fill="#d7e94d" opacity=".18"/>
  <text x="72" y="86" fill="#b93624" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">CAUÃ AI / WIDGET AO VIVO</text>
  <text x="72" y="130" fill="#0b1210" font-family="Arial,sans-serif" font-size="22">Uma interface compacta para tornar o trabalho fácil de descobrir.</text>

