    <text x="324" y="433" fill="#d7e94d" font-family="monospace" font-size="16">C:\portfolio&gt; caua-ai --online</text>
    <text x="308" y="486" fill="#d8ffe0" font-family="Arial,sans-serif" font-size="20" font-weight="700">Olá! Sou o Cauã AI.</text>
    <text x="308" y="518" fill="#d1ead5" font-family="Arial,sans-serif" font-size="18">Posso ajudar você a explorar projetos,</text>
    <text x="308" y="546" fill="#d1ead5" font-family="Arial,sans-serif" font-size="18">experiência e serviços publicados.</text>

