<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Cauã AI widget preview</title>
  <desc id="desc">Terminal-inspired portfolio assistant with a welcome message, suggested questions and a streaming input.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ed"/>
      <stop offset="1" stop-color="#ded4c4"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12201b"/>
      <stop offset="1" stop-color="#07100d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#07100d" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="104" cy="140" r="38" fill="none" stroke="#17211d" stroke-opacity=".18"/>
  <circle cx="1080" cy="770" r="92" fill="#d7e94d" opacity=".35"/>
  <path d="M0 790c240-90 410 88 660-4 224-83 354-52 540 17v97H0Z" fill="#d7e94d" opacity=".18"/>
  <text x="72" y="86" fill="#e15a3d" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">CAUÃ AI / LIVE WIDGET</text>
  <text x="72" y="130" fill="#151b18" font-family="Arial,sans-serif" font-size="22">A small interface with a serious job: make the work discoverable.</text>

  <g filter="url(#shadow)">
    <rect x="264" y="178" width="672" height="612" rx="24" fill="url(#panel)"/>
    <rect x="264" y="178" width="672" height="92" rx="24" fill="#152820"/>
    <path d="M264 270h672" stroke="#d8ffe0" stroke-opacity=".15"/>
    <rect x="292" y="207" width="38" height="38" rx="9" fill="none" stroke="#8ee68a" stroke-width="3"/>
    <path d="M304 219h13m-13 7h8m-8 7h13" stroke="#8ee68a" stroke-width="2"/>
    <text x="350" y="223" fill="#d8ffe0" font-family="monospace" font-size="20" font-weight="700">caua_ai.exe</text>
    <text x="350" y="248" fill="#75947c" font-family="monospace" font-size="12" letter-spacing="2">PORTFOLIO ASSISTANT / V1.0</text>
    <text x="866" y="229" fill="#9ab5a0" font-family="Arial,sans-serif" font-size="23">×</text>

    <circle cx="300" cy="308" r="6" fill="#8ee68a"/>
    <text x="318" y="314" fill="#8ee68a" font-family="monospace" font-size="13" letter-spacing="2">ONLINE</text>
    <text x="756" y="314" fill="#52705a" font-family="monospace" font-size="13">c:\portfolio\caua&gt;</text>
    <path d="M264 342h672" stroke="#d8ffe0" stroke-opacity=".1"/>

    <text x="308" y="386" fill="#71917a" font-family="monospace" font-size="14">caua-ai@portfolio $</text>
    <rect x="308" y="407" width="480" height="38" rx="6" fill="#22332a" stroke="#7d9b70" stroke-opacity=".6"/>
    <text x="324" y="433" fill="#d7e94d" font-family="monospace" font-size="16">C:\portfolio&gt; caua-ai --online</text>
    <text x="308" y="486" fill="#d8ffe0" font-family="Arial,sans-serif" font-size="20" font-weight="700">Olá! Sou o Cauã AI.</text>
    <text x="308" y="518" fill="#b6d1bb" font-family="Arial,sans-serif" font-size="18">Posso ajudar você a explorar projetos,</text>
    <text x="308" y="546" fill="#b6d1bb" font-family="Arial,sans-serif" font-size="18">experiência e serviços publicados.</text>

    <rect x="308" y="584" width="156" height="34" rx="6" fill="none" stroke="#52705a"/>
    <text x="324" y="606" fill="#9ab5a0" font-family="monospace" font-size="12">+ Projetos com IA</text>
    <rect x="476" y="584" width="190" height="34" rx="6" fill="none" stroke="#52705a"/>
    <text x="492" y="606" fill="#9ab5a0" font-family="monospace" font-size="12">+ Experiência profissional</text>
    <rect x="678" y="584" width="142" height="34" rx="6" fill="none" stroke="#52705a"/>
    <text x="694" y="606" fill="#9ab5a0" font-family="monospace" font-size="12">+ Ro... Digital</text>

    <rect x="308" y="644" width="564" height="98" rx="8" fill="#09120f" stroke="#8ee68a" stroke-width="2"/>
    <text x="328" y="681" fill="#8ee68a" font-family="monospace" font-size="20">›</text>
    <text x="354" y="681" fill="#52705a" font-family="monospace" font-size="16">digite sua pergunta...</text>
    <text x="328" y="719" fill="#d8ffe0" font-family="monospace" font-size="14" font-weight="700">0/8000 · ENTER envia · SHIFT+ENTER quebra linha</text>
    <text x="840" y="719" fill="#9ab5a0" font-family="monospace" font-size="18">↵</text>
  </g>

  <text x="72" y="846" fill="#59605a" font-family="monospace" font-size="14">lazy-loaded · shadow DOM · SSE streaming · sources on demand</text>
</svg>
